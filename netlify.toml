[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  # The site is a static export; Netlify's Next.js server runtime is not needed.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# keniswcs.com -> www.keniswcs.com is handled by the primary domain setting in
# Netlify (Domain management). Adding the same redirect here causes a loop if the
# primary domain is ever set to keniswcs.com.

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
