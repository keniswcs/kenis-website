[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  # The site is a static export; Netlify's Next.js server runtime is not needed.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

[[redirects]]
  from = "https://keniswcs.com/*"
  to = "https://www.keniswcs.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://keniswcs.com/*"
  to = "https://www.keniswcs.com/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
