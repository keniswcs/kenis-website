[build]
  command = "npm run build"
  publish = "out"

[build.environment]
  NODE_VERSION = "24"
  # The site is a static export; Netlify's Next.js server runtime is not needed.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"

# keniswcs.com -> www.keniswcs.com is handled by the primary domain setting in
# Netlify (Domain management). Adding the same redirect here causes a loop if the
# primary domain is ever set to keniswcs.com.

# Addresses used by the October 2026 simplified site; keep so old links still work.
[[redirects]]
  from = "/solutions/ai-operations/*"
  to = "/ai-operations/"
  status = 301

[[redirects]]
  from = "/solutions/analytics/*"
  to = "/analytics/"
  status = 301

[[redirects]]
  from = "/solutions/deployment/*"
  to = "/deployment/"
  status = 301

[[redirects]]
  from = "/solutions/*"
  to = "/capabilities/"
  status = 301

[[redirects]]
  from = "/why-kenis/*"
  to = "/expertise/"
  status = 301

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
